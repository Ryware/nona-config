name: Kotlin client CI

on:
  pull_request:
    paths:
      - 'client/kotlin/**'
      - 'client/qa/**'
      - 'core/**'
      - 'libsql/**'
      - '.github/workflows/kotlin-client.yml'
      - '.github/workflows/client-sdk-release.yml'
  push:
    branches: [development]
    paths:
      - 'client/kotlin/**'
      - 'client/qa/**'
      - '.github/workflows/kotlin-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared QA contracts
        run: python3 -m unittest discover -s client/qa -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, Java API, lint and release artifacts
        working-directory: client/kotlin
        run: ./gradlew :nona-client:testDebugUnitTest :nona-client:lintRelease :nona-client:assembleRelease :sample:assembleDebug :sample:assembleDebugAndroidTest :sample:lintDebug

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared QA contracts
        run: python3 -m unittest discover -s client/qa -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start isolated backend and seed fixtures
        shell: bash
        run: |
          dotnet build core/src/WebApi/WebApi.csproj -c Debug
          mkdir -p "$RUNNER_TEMP/nona-qa"
          export Storage__Type=Sqlite
          export Storage__Sqlite__DataSource="$RUNNER_TEMP/nona-qa/nona.db"
          export ASPNETCORE_URLS=http://127.0.0.1:18686
          dotnet run --project core/src/WebApi/WebApi.csproj --no-build --no-launch-profile > "$RUNNER_TEMP/nona-qa/server.log" 2>&1 &
          python3 client/qa/fault-server.py > "$RUNNER_TEMP/nona-qa/fault.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18686/auth/first-time > /dev/null; then break; fi
            sleep 1
          done
          python3 client/qa/seed-server.py --output "$RUNNER_TEMP/nona-qa/fixtures.json"
      - name: Build device tests
        working-directory: client/kotlin
        run: ./gradlew :sample:assembleDebug :sample:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 client/kotlin/qa/run-device-tests.py --serial emulator-5554 --fixtures "$RUNNER_TEMP/nona-qa/fixtures.json" --output "client/kotlin/build/qa/api-${{ matrix.api }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-qa-api-${{ matrix.api }}
          path: client/kotlin/build/qa/
