name: Swift CocoaPods release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      version:
        description: Stable shared release version.
        required: false
        type: string
      checkout_ref:
        description: Immutable commit to validate and publish.
        required: false
        type: string

permissions:
  contents: read

# Never interrupt a release while Trunk may be accepting it.
concurrency:
  group: swift-cocoapods-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve an existing stable version tag
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          EXPECTED_SHA: ${{ inputs.checkout_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable version such as 0.1.0, without a v prefix.' >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_VERSION"
          sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ -n "$EXPECTED_SHA" ] && [ "$sha" != "$EXPECTED_SHA" ]; then
            echo "Tag $RELEASE_VERSION does not point to the requested release commit." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release $RELEASE_VERSION: $sha" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: resolve
    uses: ./.github/workflows/swift-client.yml
    with:
      checkout_ref: ${{ needs.resolve.outputs.sha }}

  release:
    needs: [resolve, test]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Install CocoaPods
        run: |
          if ! command -v pod > /dev/null; then brew install cocoapods; fi
          pod --version
      - name: Stamp CocoaPods version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          podspec = Path('NonaClient.podspec')
          text = podspec.read_text()
          text, count = re.subn(r"(?m)^\s*s\.version\s*=\s*['\"][^'\"]+['\"]\s*$",
                                f"  s.version = '{os.environ['RELEASE_VERSION']}'", text)
          if count != 1:
              raise SystemExit('Expected exactly one CocoaPods version declaration.')
          podspec.write_text(text)
          PY
      - name: Verify podspec and release source
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          pod ipc spec NonaClient.podspec > "$RUNNER_TEMP/NonaClient.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          spec = json.loads((Path(os.environ['RUNNER_TEMP']) / 'NonaClient.json').read_text())
          expected = {'git': 'https://github.com/Ryware/nona-config.git', 'tag': os.environ['RELEASE_VERSION']}
          if spec.get('name') != 'NonaClient' or spec.get('version') != os.environ['RELEASE_VERSION'] or spec.get('source') != expected:
              raise SystemExit('Pod name, version or source does not match the requested NonaClient release.')
          PY
      - name: Validate the pod downloaded from the release tag
        run: |
          pod spec lint NonaClient.podspec --platforms=ios,osx --swift-version=5.9
          pod spec lint NonaClient.podspec --platforms=ios,osx --swift-version=6.0
      - name: Ensure the tag still points to the tested commit
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_VERSION"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
      - name: Publish to CocoaPods Trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo 'Add COCOAPODS_TRUNK_TOKEN in repository Actions secrets before publishing.' >&2
            exit 1
          fi
          pod trunk push NonaClient.podspec
      - name: Summarize result
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          echo "Published NonaClient $RELEASE_VERSION to CocoaPods Trunk." >> "$GITHUB_STEP_SUMMARY"
